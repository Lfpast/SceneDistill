# @package _global_

defaults:
  - override /data: scannet_tagging
  - override /model: probe_tagging
  - override /callbacks: tagging

# Qwen3.5-4B LLM hidden-state features at visual-token positions.
# Features live at <feat_root>/qwen3.5-4b/<split>/<scene>/feature_layerN.sft.

seed: 42
tags: ["train", "scannet", "semantic-tagging"]
task_name: semantic-tagging
job_name: default
autoresume: true
enable_train_logger: true

gt_num_frames: 8
batch_size: 8
num_classes: 20
target_spatial_size: null

paths:
  log_dir: /project/peilab/jys/probing/ScanNet/qwen3.5-4b
  run_folder_name: ${task_name}/${job_name}

hydra:
  run:
    dir: ${paths.log_dir}/${paths.run_folder_name}

vfm_name: qwen3.5-4b
feat_postfix: _layer20
vfm_channels: 2560

data:
  data_root: /project/peilab/jys/probing_data/ScanNet/ScanNet-processed
  feat_root: /project/peilab/jys/probing_data/ScanNet/FEAT
  data_module:
    train_datasets:
      - ScanNetTaggingDataset(root='${data.data_root}', root_vfm='${data.feat_root}', split='train', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feat_pixalign=True, num_views=${gt_num_frames}, min_view_interval=5, context_len=76, query_idx_divisor=4, target_spatial_size=${target_spatial_size}, num_classes=${num_classes}, min_pixels_per_video=200, min_frames_present=1)
    validation_datasets:
      - ScanNetTaggingDataset(root='${data.data_root}', root_vfm='${data.feat_root}', split='val', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feat_pixalign=True, num_views=${gt_num_frames}, min_view_interval=5, context_len=76, query_idx_divisor=4, seed=0, target_spatial_size=${target_spatial_size}, num_classes=${num_classes}, min_pixels_per_video=200, min_frames_present=1)
    batch_size_per_device: ${batch_size}
    batch_size_per_device_val: ${batch_size}
    num_workers: 4
    num_workers_val: 4

logger:
  wandb:
    entity: yjiaag-hkust
    project: Semantic-Tagging
    name: ${job_name}
    group: qwen3.5-4b
    tags: [qwen3.5-4b, "${feat_postfix}"]

model:
  data_root: ${data.data_root}
  train_pos_rate_path: ${data.data_root}/train_pos_rate_${num_classes}.npy
  probe:
    video_channels: ${vfm_channels}
    clip_init_path: /project/peilab/jys/probing_data/ScanNet/clip_class_embeds_${num_classes}_vitl14.npy

trainer:
  devices: auto
  max_epochs: 10
  precision: bf16-mixed
  check_val_every_n_epoch: 1
