# @package _global_

defaults:
  - override /model: probe


# Qwen3.5-4B visual-encoder probe training configuration.
# Features are extracted from model.model.get_image_features(...).hidden_states
# and stored under <feat_root>/qwen3.5-4b-visual/<subset>/<scene>/feature_layerN.sft.

seed: 42

tags: ["train", "dl3dv", "qwen3.5", "visual-encoder"]

task_name: dl3dv
job_name: default # must set in the command line

autoresume: true
enable_train_logger: true

gt_num_frames: 4
batch_size: 10

vfm_name: qwen3.5-4b-visual
vfm_channels: 1024  # Qwen3.5 vision_config.hidden_size.
target_spatial_size: null

paths:
  log_dir: /project/peilab/jys/probing/DL3DV/qwen3.5-4b-visual
  run_folder_name: ${job_name}

hydra:
  run:
    dir: ${paths.log_dir}/${paths.run_folder_name}

# Visual encoder depth is 24. Override feat_postfix on the command line for sweeps.
feat_postfix: _layer1

data:
  data_module:
    train_datasets:
    - VideoProbeDataset(root='${data.data_root}', root_vfm='${data.feat_root}', subset='all', split='train', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feat_pixalign=True, num_views=${gt_num_frames}, min_view_interval=5, context_len=76, query_idx_divisor=4, target_spatial_size=${target_spatial_size})
    validation_datasets:
    - VideoProbeDataset(root='${data.data_root}', root_vfm='${data.feat_root}', subset='all', split='val', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feat_pixalign=True, num_views=${gt_num_frames}, min_view_interval=5, context_len=76, query_idx_divisor=4, seed=0, target_spatial_size=${target_spatial_size})
    batch_size_per_device: ${batch_size}
    batch_size_per_device_val: ${batch_size}
    num_workers: 8
    num_workers_val: 8

logger:
  wandb:
    entity: yjiaag-hkust
    project: 3D-Geometry
    name: ${job_name}
    group: qwen3.5-4b-visual
    tags: [qwen3.5-4b, visual-encoder, "${feat_postfix}"]

model:
  probe_type: pixalign
  probe:
    _target_: probing_vlm_vgm.models.components.probe_pixalign.ProbeModelPA
    embed_dim: 1024
    video_channels: ${vfm_channels}
    backbone_depth: 4
    dpt_intermediate_layer_idx: [0, 1, 2, 3]
    gradient_checkpointing: true
    active_heads: ["depth", "point", "camera"]
  val_viz_freq: 5
  train_eval_freq: 5000
  save_pointcloud: false

  loss_weights:
    pmap: 1.0
    dmap: 1.0
    pmap_grad: 0.0
    dmap_grad: 0.0
    camera: 1.0

  normalize_pred: true
  normalize_gt: true
  soft_bg_weight: 0.0
  cmap_power: 1.0

trainer:
  devices: auto
  max_epochs: 60
  precision: bf16-mixed
