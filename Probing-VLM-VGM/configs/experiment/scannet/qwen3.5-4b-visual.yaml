# @package _global_

defaults:
  - override /data: scannet_instance
  - override /model: instance_probe_mlp
  - override /callbacks: instance

# Qwen3.5-4B visual-encoder hidden states.
# Features live at <feat_root>/qwen3.5-4b-visual/<split>/<scene>/feature_layerN.sft.

seed: 42
tags: ["train", "scannet", "instance-grouping", "visual-encoder"]
task_name: instance-grouping
job_name: default
autoresume: true
enable_train_logger: true

gt_num_frames: 8
batch_size: 8
target_spatial_size: null

paths:
  log_dir: /project/peilab/jys/probing/ScanNet/qwen3.5-4b-visual
  run_folder_name: ${task_name}/${job_name}

hydra:
  run:
    dir: ${paths.log_dir}/${paths.run_folder_name}

vfm_name: qwen3.5-4b-visual
feat_postfix: _layer20
vfm_channels: 1024

data:
  data_root: /project/peilab/jys/probing_data/ScanNet/ScanNet-processed
  feat_root: /project/peilab/jys/probing_data/ScanNet/FEAT
  data_module:
    train_datasets:
      - ScanNetInstanceDataset(root='${data.data_root}', root_vfm='${data.feat_root}', split='train', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feat_pixalign=True, num_views=${gt_num_frames}, min_view_interval=5, context_len=76, query_idx_divisor=4, target_spatial_size=${target_spatial_size})
    validation_datasets:
      - ScanNetInstanceDataset(root='${data.data_root}', root_vfm='${data.feat_root}', split='val', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feat_pixalign=True, num_views=${gt_num_frames}, min_view_interval=5, context_len=76, query_idx_divisor=4, seed=0, target_spatial_size=${target_spatial_size})
    batch_size_per_device: ${batch_size}
    batch_size_per_device_val: ${batch_size}
    num_workers: 4
    num_workers_val: 4

logger:
  wandb:
    entity: yjiaag-hkust
    project: Instance-Grouping
    name: ${job_name}
    group: qwen3.5-4b-visual
    tags: [qwen3.5-4b-visual, visual-encoder, "${feat_postfix}"]

model:
  probe:
    video_channels: ${vfm_channels}

trainer:
  devices: auto
  max_epochs: 40
  precision: bf16-mixed
  check_val_every_n_epoch: 1
